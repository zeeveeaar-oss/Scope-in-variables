<!DOCTYPE html>
<html>
<head>
    <title>Scope of variables</title>
</head>
<body>
    
    <p>This is a function that demonstrates scope of variables.</p>
    <button type="button" onclick="myfunction()">click me</button>
    <p id="demo"></p>
    <p id="demo1"></p>
    <script>
        let b=5;
        function myfunction(){
            let a=21;
            document.getElementById("demo").innerHTML=b * a;
        }
         document.getElementById("demo1").innerHTML = a;
          document.getElementById("demo").innerHTML = b;
    </script>
</body>
</html>
